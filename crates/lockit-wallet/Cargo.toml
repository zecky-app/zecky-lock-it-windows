[package]
name = "lockit-wallet"
description = "Zecky Lock it: the wallet, on the official Zcash crates in the same versions as the Zecky engine."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The Zcash core, pinned by Cargo.lock to the Zecky engine's exact versions.
zcash_client_backend = { version = "0.25", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "transparent-inputs", "tor", "sync", "pczt"] }
zcash_client_sqlite = { version = "0.23", features = ["orchard", "transparent-inputs", "serde"] }
zcash_keys = { version = "0.17", features = ["orchard"] }
zcash_primitives = "0.31"
zcash_proofs = "0.31"
zcash_protocol = "0.11"
zcash_address = "0.14"
zip32 = "0.3"

async-trait = "0.1"
bip0039 = "0.14"
futures-util = "0.3"
uuid = "1"
ur = "0.5"
pczt = { version = "0.10", features = ["orchard", "prover"] }
orchard = "0.16"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.10"
rusqlite = "0.37"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
tonic = "0.14"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
