[package]
name = "lockit-tor"
description = "Zecky Lock it: Go Max's own onion address, so a paired phone can reach the node from anywhere without extra apps."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
arti-client = { version = "0.48", default-features = false, features = ["tokio", "rustls", "onion-service-service", "static-sqlite"] }
# Pinned to the versions Arti 0.48 itself uses.
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
safelog = "=0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tor-hsrproxy = "0.48"
tor-hsservice = "0.48"
tor-rtcompat = { version = "0.48", features = ["tokio", "rustls"] }

[dev-dependencies]
tempfile = "3"
